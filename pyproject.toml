[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "omnibioai-security-audit"
version = "0.1.0"
description = "Tenant-aware, tamper-evident Security Audit service"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "alembic>=1.13,<2",
  "anyio>=4.4,<4.10",
  "cryptography==46.0.3",
  "fastapi>=0.115,<0.116",
  "PyJWT[crypto]>=2.8",
  "pydantic>=2.10,<3",
  "pymysql",
  "redis>=5,<6",
  "sqlalchemy>=2,<3",
  "uvicorn>=0.34,<0.35",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<0.29",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<7",
  "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "api*",
  "audit*",
  "consumers*",
  "db*",
  "schemas*",
  "scripts*",
  "services*",
  "worker*",
]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

